[project]
name = "qcnet"
version = "0.1.0"
description = "Trains SerenaBot's small integer network and its pattern table from ./qc.sh dataset output"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
qcnet = "qcnet.train:main"
qcpatterns = "qcnet.patterns:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qcnet"]
