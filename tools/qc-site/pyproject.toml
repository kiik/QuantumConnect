[project]
name = "qcsite"
version = "0.1.0"
description = "CLI and MCP server for the QuantumConnect arena site (leaderboard, matches)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "mcp>=1.2",
]

[project.scripts]
qcsite = "qcsite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qcsite"]
